<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Arrange widgets</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="arrange.css">
</head>
<!-- Arrange mode overlay (DESIGN.md 4): one per display, above everything. The widgets
     themselves are separate windows lifted above this one; here are the scrim, outlines,
     handles, readout tags, snap guides and, on the primary display, the arrange bar.
     All hit-testing and geometry happen in the main process; this page forwards the pointer. -->
<body class="overlay">
  <div class="scrim"></div>
  <div class="guides"></div>
  <div class="items"></div>
  <div class="arrange-bar" role="toolbar" aria-label="Arrange widgets" hidden>
    <span class="arrange-bar__name">Arranging</span>
    <span class="arrange-bar__hint"></span>
    <span class="arrange-bar__actions">
      <button type="button" data-action="centre">Centre</button>
      <button type="button" data-action="reset">Reset</button>
      <button type="button" class="arrange-bar__done" data-action="done">Done<kbd>Enter</kbd></button>
    </span>
  </div>
  <script type="module" src="arrange.js"></script>
</body>
</html>
